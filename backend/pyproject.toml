[project]
name = "resiliencepilot"
version = "0.1.0"
description = "Resilience workbench for the Eclipse SDV Fleet Management Blueprint"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.32,<0.33", "httpx>=0.27,<0.28", "pydantic>=2.9,<3",
                "tzdata; sys_platform == 'win32'"]   # IANA zones for the data-quality normalizer on Windows

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["resiliencepilot", "resiliencepilot.dq"]   # explicit: backend/data/ holds runtime evidence, not code

[tool.setuptools.package-data]
resiliencepilot = ["static/*.html"]

[project.scripts]
rp = "resiliencepilot.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
slides = ["python-pptx>=1.0,<2"]   # scripts/make_ppt.py

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs the running SDV stack (set RP_LIVE=1)"]
