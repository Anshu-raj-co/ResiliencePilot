[project]
name = "resiliencepilot"
version = "0.1.0"
description = "Resilience workbench for the Eclipse SDV Fleet Management Blueprint"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.32,<0.33", "httpx>=0.27,<0.28", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs the running SDV stack (set RP_LIVE=1)"]
