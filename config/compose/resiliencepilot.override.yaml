# ResiliencePilot local override for the Eclipse SDV Fleet Management Blueprint.
# The upstream compose files declare `overlay` networks, which require Docker Swarm.
# For a single-host local sandbox we use plain bridge networks instead (see docs/DECISIONS.md D-002).
networks:
  fms-backend:
    driver: bridge
    attachable: false
  fms-vehicle:
    driver: bridge
    attachable: false

# Host port for the KUKSA databroker is configurable (default 55555 upstream; see DECISIONS D-012).
# Nothing in ResiliencePilot uses this host port; services reach the databroker over the fms-vehicle network.
services:
  databroker:
    ports: !override
      - "${FMS_DATABROKER_BIND_HOST:-127.0.0.1}:${RP_DATABROKER_HOST_PORT:-55557}:55556"
